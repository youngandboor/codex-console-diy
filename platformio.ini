[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_unflags =
  -DARDUINO_USB_MODE=1
  -std=gnu++11
lib_deps =
  bblanchon/ArduinoJson @ 6.21.6
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -std=gnu++17
test_ignore = test_frame_codec

[env:native]
platform = native
test_framework = unity
build_src_filter =
  +<protocol/FrameCodec.cpp>
test_build_src = yes
test_filter = test_frame_codec
